<!DOCTYPE html>
<html>
<head>
    <title>Train Reservation System</title>
</head>
<body>

    <h1>🚆 Online Train Reservation</h1>

    <!-- Login -->
    <h2>Login</h2>
    <form>
        <input type="text" placeholder="Username"><br>
        <input type="password" placeholder="Password"><br>
        <button>Login</button>
    </form>

    <!-- Registration -->
    <h2>Register</h2>
    <form>
        <input type="text" placeholder="Name"><br>
        <input type="email" placeholder="Email"><br>
        <button>Register</button>
    </form>

    <!-- Search & Book Ticket -->
    <h2>Book Ticket</h2>
    <form>
        <input type="text" placeholder="Origin Station"><br>
        <input type="text" placeholder="Destination Station"><br>
        <input type="date"><br>
        <select>
            <option>General</option>
            <option>Sleeper</option>
            <option>AC</option>
        </select><br>
        <button>Search & Book</button>
    </form>

    <!-- Check PNR -->
    <h2>Check PNR Status</h2>
    <form>
        <input type="text" placeholder="Enter PNR No"><br>
        <button>Check Status</button>
    </form>

    <!-- Cancel Ticket -->
    <h2>Cancel Ticket</h2>
    <form>
        <input type="text" placeholder="PNR No"><br>
        <button>Cancel Ticket</button>
    </form>

</body>
</html>
