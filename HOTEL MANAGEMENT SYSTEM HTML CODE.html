<!DOCTYPE html>
<html>
<head>
  <title>Hotel Booking</title>
</head>
<body>
  <h1>Hotel Room Booking</h1>

  <h2>Search Hotels</h2>
  <form>
    <input type="text" placeholder="Destination"><br>
    <input type="date"> Check-in<br>
    <input type="date"> Check-out<br>
    <input type="number" placeholder="Guests"><br>
    <button>Search</button>
  </form>

  <h2>Book Room</h2>
  <form>
    <select>
      <option>Single</option>
      <option>Double</option>
    </select><br>
    <button>Book Now</button>
  </form>
</body>
</html>
